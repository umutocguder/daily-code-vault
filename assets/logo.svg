<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gitbotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge -->
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  
  <!-- Circular Glow Backdrop -->
  <circle cx="256" cy="256" r="160" fill="url(#gitbotGrad)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Git Bot Branching Network -->
  <!-- Main Trunk Line -->
  <line x1="160" y1="120" x2="160" y2="392" stroke="#334155" stroke-width="16" stroke-linecap="round" />
  <line x1="160" y1="120" x2="160" y2="392" stroke="url(#gitbotGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Branch Curve -->
  <path d="M 160 270 C 160 200, 320 230, 320 160" fill="none" stroke="url(#gitbotGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Merge Curve -->
  <path d="M 160 330 C 160 300, 320 280, 320 230" fill="none" stroke="#06B6D4" stroke-width="6" stroke-dasharray="8 8" stroke-linecap="round" />
  
  <!-- Nodes / Commit Points -->
  <circle cx="160" cy="140" r="28" fill="#0F172A" stroke="#4F46E5" stroke-width="8" />
  <circle cx="160" cy="140" r="12" fill="#818CF8" />
  
  <circle cx="160" cy="270" r="28" fill="#0F172A" stroke="#06B6D4" stroke-width="8" />
  <circle cx="160" cy="270" r="12" fill="#22D3EE" />
  
  <circle cx="160" cy="380" r="28" fill="#0F172A" stroke="#10B981" stroke-width="8" />
  <circle cx="160" cy="380" r="12" fill="#34D399" />
  
  <circle cx="320" cy="160" r="28" fill="#0F172A" stroke="#06B6D4" stroke-width="8" />
  <circle cx="320" cy="160" r="12" fill="#67E8F9" />

  <!-- Robot Automation Antenna / Accent -->
  <path d="M 320 132 L 320 100" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
  <circle cx="320" cy="94" r="8" fill="#22D3EE" filter="url(#glow)" />
  
  <!-- Synchronize Loop Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gitbotGrad)" stroke-width="3" stroke-dasharray="16 24" opacity="0.4" />
</svg>
